    <text x="90" y="1126" font-size="28" fill="#9FB3D1">Pontos mérés a fizikai ügyfélterekben</text>
    <text x="1110" y="1126" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="end">xperion.hu</text>
